[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crewclock-fortyguard"
version = "0.1.0"
description = "CrewClock construction shift planning agent and FortyGuard integration."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
live = ["requests>=2.31.0"]
test = ["pytest>=8.0"]

[project.scripts]
crewclock-api = "fortyguard_agent.production_service:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
